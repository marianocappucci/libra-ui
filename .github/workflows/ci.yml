name: CI

# Este paquete no tenia ni tests ni CI, siendo el codigo compartido que
# consumen los 6 productos: su Login, su recuperacion de contrasena y su
# cliente HTTP corren en todos. Un error aca se multiplica por seis.
#
# Es codigo fuente puro (los `exports` del package.json apuntan a .ts/.tsx
# y cada consumidor lo compila con su propio Vite), asi que no hay build
# que verificar -- solo los tests y el chequeo de tipos.

on:
  # Sin `push` a ramas: `develop` y `main` estan protegidas (2026-08-11,
  # `enforce_admins: true`), asi que todo entra por PR y el run del PR verifica
  # el MERGE -- que es exactamente lo que queda en la rama. El push repetia esa
  # misma verificacion sobre un arbol identico: medido, tres commits distintos
  # con el mismo tree hash y hasta cuatro corridas por cambio.
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya
# no le sirve a nadie, porque reporta sobre un codigo que no es el que quedo
# en la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Correr los tests con cobertura
        run: npm run test:coverage

      # Los consumidores compilan estos archivos con `tsc -b` en su propio
      # build: un error de tipos aca no se veria hasta que uno de los seis
      # intente construir su imagen.
      #
      # Con `tsconfig.check.json` y NO con el tsconfig.json a secas: ese
      # ultimo no mapea `@/*`, asi que `tsc` no resuelve ningun import de
      # shadcn y devuelve 24 errores falsos. Es exactamente el mismo
      # descuido que hubo el mismo dia en farmacia: verificar en local con
      # un comando y escribir otro en el workflow.
      - name: Chequeo de tipos
        run: npm run typecheck
