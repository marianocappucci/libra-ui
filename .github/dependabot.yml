# Dependabot: avisa (por PR) cuando una dependencia de TERCEROS tiene una
# version nueva o un CVE. Agrupado por ecosistema para que sea
# UN PR por ecosistema, no uno por paquete. Los motores de la familia (libra*)
# se excluyen: van por tag de git y los propaga bump-motores (ver libra-bump).
# Sin target-branch (2026-10-12): en libra-ui la linea viva es main, y con
# target-branch: develop los PRs de dependabot quedaban atrapados en una rama
# que nadie promovia (el #291 nunca llego a main).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Los motores de la familia se pinean por tag de git y se propagan
      # con el workflow bump-motores (ver libra-bump), no por dependabot.
      - dependency-name: "libra*"
      # 🔴 `vitest` y su proveedor de cobertura quedan en 3.x a proposito
      # (2026-09-08). `@vitest/coverage-v8` v5 cuenta las lineas de otra
      # manera: sobre los MISMOS diez archivos mide 206 lineas donde v3 mide
      # 870, asi que el umbral de cobertura de este repo dejaria de significar
      # lo mismo -- y no hay `include`/`exclude` que lo recupere, porque el
      # conjunto de archivos ya es identico.
      # Los dos van juntos: coverage-v8@3.2.7 pide vitest 3.2.7 exacto.
      # Se ignoran los MAJORS, no las correcciones dentro de 3.x.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # `@vitejs/plugin-react` NO se ignora: 6.1.2 entra limpio gracias al `overrides` de `@babel/plugin-transform-runtime`
      # del package.json (ADR-055). Sin el `overrides`, npm elige Babel 8 para una dependencia opcional que el kit no usa,
      # choca con el Babel 7 que piden los plugins de `@svgr` y da ERESOLVE al actualizar el lock.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
